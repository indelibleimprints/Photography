<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Indelible Imprints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vetvisualshop/style.css">
</head>
<body>
  <!-- Static Background (fixed, does not scroll) -->
  <div class="shop-background"></div>

  <div class="sticky-top">
    <!-- Header -->
    <header>
      <h1><a href="shop.html">Your Cart</a></h1>
      <a class="cart-link" href="shop.html">Shops</a>
    </header>
  </div>

  <!-- Cart -->
  <main class="shop-index">
    <a class="back-link" href="shop.html">&larr; Continue shopping</a>
    <h2>Your Cart</h2>
    <p class="shop-intro" style="text-align:left; margin-bottom: 1rem;">Holds items added from any shop.</p>
    <div id="cart-items"></div>
    <div id="cart-summary" class="cart-summary"></div>
  </main>

  <!-- Footer -->
  <footer>
    <a href="index.html"><img src="images/logo.jpeg" alt="Indelible Imprints Logo" class="footer-logo"></a>
    <p>&copy; 2025 Indelible Imprints. All Rights Reserved.</p>
  </footer>

  <script src="vetvisualshop/products.js"></script>
  <script src="wirewrapped/products.js"></script>
  <script src="resale/products.js"></script>
  <script src="streamItem.js"></script>
  <script src="cart.js"></script>
  <script>
    const ALL_ITEMS = [...VET_PRODUCTS, ...WIREWRAPPED_PRODUCTS, ...RESALE_PRODUCTS, ...STREAM_ITEMS];

    function render() {
      const cart = getCart();
      const itemsEl = document.getElementById("cart-items");
      const summaryEl = document.getElementById("cart-summary");

      if (cart.length === 0) {
        itemsEl.innerHTML = `<p>Your cart is empty.</p>`;
        summaryEl.innerHTML = "";
        updateCartBadge();
        return;
      }

      let total = 0;
      itemsEl.innerHTML = cart.map(entry => {
        const product = ALL_ITEMS.find(p => p.id === entry.id);
        if (!product) return "";
        const maxQty = product.quantity || 1;
        const lineTotal = product.price * entry.qty;
        total += lineTotal;
        return `
          <div class="cart-row">
            <img src="${product.image}" alt="${product.name}">
            <div class="cart-row-info">
              <h3>${product.name}</h3>
              <p class="price">$${product.price.toFixed(2)} each</p>
            </div>
            <input type="number" class="cart-qty" min="1" max="${maxQty}" value="${entry.qty}" data-id="${product.id}" data-max="${maxQty}" ${maxQty <= 1 ? 'disabled' : ''}>
            <p class="line-total">$${lineTotal.toFixed(2)}</p>
            <button class="remove-btn" data-id="${product.id}">Remove</button>
          </div>
        `;
      }).join("");

      const shipping = calculateShipping(total);
      const grandTotal = total + shipping;
      const shippingLabel = shipping === 0 ? "Free" : `$${shipping.toFixed(2)}`;

      summaryEl.innerHTML = `
        <p class="cart-line">Subtotal: $${total.toFixed(2)}</p>
        <p class="cart-line">Shipping: ${shippingLabel}</p>
        <p class="cart-total">Total: $${grandTotal.toFixed(2)}</p>
        <a class="btn cashapp-btn" id="cashapp-btn" target="_blank" rel="noopener">Pay with Cash App</a>
        <a class="btn venmo-btn" id="venmo-btn" target="_blank" rel="noopener">Pay with Venmo</a>
        <a class="btn paypal-btn" id="paypal-btn" target="_blank" rel="noopener">Pay with PayPal</a>
      `;

      document.querySelectorAll(".cart-qty").forEach(input => {
        input.addEventListener("change", e => {
          const max = parseInt(e.target.dataset.max, 10) || 1;
          const newQty = Math.min(max, Math.max(1, parseInt(e.target.value, 10) || 1));
          updateCartQty(parseInt(e.target.dataset.id, 10), newQty);
          render();
        });
      });

      document.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          removeFromCart(parseInt(e.target.dataset.id, 10));
          render();
        });
      });

      const cashappBtn = document.getElementById("cashapp-btn");
      cashappBtn.href = `https://cash.app/$ChadSneary/${grandTotal.toFixed(2)}`;

      const venmoBtn = document.getElementById("venmo-btn");
      const venmoNote = encodeURIComponent("Shop order");
      venmoBtn.href = `https://venmo.com/u/Chad-Sneary?txn=pay&amount=${grandTotal.toFixed(2)}&note=${venmoNote}`;

      const paypalBtn = document.getElementById("paypal-btn");
      paypalBtn.href = `https://paypal.me/ChadSneary/${grandTotal.toFixed(2)}USD`;

      // Reserve every item in the cart the moment a payment button is
      // clicked, so nobody else can buy the same one-off piece while this
      // payment is in flight. Fire-and-forget - doesn't block opening the
      // payment link.
      const idsInCart = cart.map(entry => entry.id);
      [cashappBtn, venmoBtn, paypalBtn].forEach(btn => {
        btn.addEventListener("click", () => {
          reserveItems(idsInCart);
        });
      });

      updateCartBadge();
    }

    render();
  </script>
</body>
</html>
