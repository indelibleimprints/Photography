<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resale Finds | Indelible Imprints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Static Background (fixed, does not scroll) -->
  <div class="shop-background"></div>

  <div class="sticky-top">
    <!-- Header -->
    <header>
      <h1>Resale Finds</h1>
      <a class="cart-link" href="../cart.html">Cart <span id="cart-count">0</span></a>
    </header>
  </div>

  <!-- Scrollable Shop Index -->
  <main class="shop-index">
    <a class="back-link" href="../shop.html">&larr; Shop Directory</a>
    <p class="shop-intro">Handpicked jewelry from craft shows and other makers. Tap an item to inquire.</p>

    <div class="shop-grid" id="shop-grid"></div>
  </main>

  <!-- Footer -->
  <footer>
    <a href="../index.html"><img src="../images/logo.jpeg" alt="Indelible Imprints Logo" class="footer-logo"></a>
    <p>&copy; 2025 Indelible Imprints. All Rights Reserved.</p>
  </footer>

  <script src="products.js"></script>
  <script src="../cart.js"></script>
  <script>
    (async () => {
      const reservedIds = await fetchReservedIds();

      const grid = document.getElementById("shop-grid");
      RESALE_PRODUCTS.forEach(product => {
        const reserved = !product.sold && reservedIds.includes(product.id);
        const unavailable = product.sold || reserved;
        const item = document.createElement("a");
        item.className = unavailable ? `shop-item ${product.sold ? "sold" : "reserved"}` : "shop-item";
        item.href = `product.html?id=${product.id}`;
        item.innerHTML = `
          <div class="shop-item-img-wrap">
            <img src="${product.image}" alt="${product.name}">
            ${product.sold ? '<span class="sold-badge">Sold</span>' : ''}
            ${reserved ? '<span class="reserved-badge">Reserved</span>' : ''}
          </div>
          <div class="shop-item-info">
            <h3>${product.name}</h3>
            <p class="price">$${product.price.toFixed(2)}</p>
          </div>
        `;
        grid.appendChild(item);
      });
      updateCartBadge();
    })();
  </script>
</body>
</html>
