<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Resale Finds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Static Background (fixed, does not scroll) -->
  <div class="shop-background"></div>

  <div class="sticky-top">
    <!-- Header -->
    <header>
      <h1><a href="index.html">Resale Finds</a></h1>
      <a class="cart-link" href="../cart.html">Cart <span id="cart-count">0</span></a>
    </header>
  </div>

  <!-- Product Detail -->
  <main class="shop-index">
    <a class="back-link" href="index.html">&larr; Back to shop</a>
    <div id="product-detail" class="product-detail"></div>
  </main>

  <!-- Footer -->
  <footer>
    <a href="../index.html"><img src="../images/logo.jpeg" alt="Indelible Imprints Logo" class="footer-logo"></a>
    <p>&copy; 2025 Indelible Imprints. All Rights Reserved.</p>
  </footer>

  <script src="products.js"></script>
  <script src="../cart.js"></script>
  <script>
    (async () => {
      const reservedIds = await fetchReservedIds();

      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"), 10);
      const product = RESALE_PRODUCTS.find(p => p.id === id);
      const container = document.getElementById("product-detail");

      if (!product) {
        container.innerHTML = `<p>Item not found.</p>`;
      } else {
        const maxQty = product.quantity || 1;
        const reserved = !product.sold && reservedIds.includes(product.id);
        const unavailable = product.sold || reserved;
        container.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="product-image">
          <div class="product-info">
            <h2>${product.name}</h2>
            <p class="price">$${product.price.toFixed(2)}</p>
            <p class="product-description">${product.description}</p>
            ${product.sold ? `
              <p class="sold-notice">This piece has sold.</p>
              <button class="btn" disabled>Sold</button>
            ` : reserved ? `
              <p class="reserved-notice">This piece is reserved for a pending order.</p>
              <button class="btn" disabled>Reserved</button>
            ` : `
              ${maxQty > 1 ? `
                <div class="qty-row">
                  <label for="qty">Quantity</label>
                  <input type="number" id="qty" value="1" min="1" max="${maxQty}">
                </div>
              ` : ''}
              <button id="add-to-cart-btn" class="btn">Add to Cart</button>
              <p id="add-confirm" class="add-confirm"></p>
            `}
          </div>
        `;

        if (!unavailable) {
          document.getElementById("add-to-cart-btn").addEventListener("click", () => {
            const qtyInput = document.getElementById("qty");
            const qty = qtyInput ? Math.max(1, parseInt(qtyInput.value, 10) || 1) : 1;
            addToCart(product.id, qty, maxQty);
            updateCartBadge();
            document.getElementById("add-confirm").textContent = "Added to cart.";
          });
        }
      }

      updateCartBadge();
    })();
  </script>
</body>
</html>
